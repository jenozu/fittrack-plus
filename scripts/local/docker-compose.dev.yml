# Local Postgres for development only. Start: docker compose -f scripts/local/docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: fittrack
      POSTGRES_DB: fittrack_db
    ports:
      - "5432:5432"
    volumes:
      - fittrack_pg:/var/lib/postgresql/data
volumes:
  fittrack_pg:
